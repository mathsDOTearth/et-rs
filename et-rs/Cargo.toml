[package]
name = "et-rs"
version = "0.1.0"
authors = ["R Neale mathsDOTearth"]
edition = "2024"
description = "Host-side Rust interface to the Esperanto ET-SoC-1 RISC-V accelerator"
license = "Apache-2.0"
repository = "https://github.com/mathsDOTearth/et-rs"
documentation = "https://docs.rs/et-rs"
readme = "README.md"
keywords = ["esperanto", "et-soc-1", "riscv", "accelerator", "driver"]
categories = ["hardware-support", "external-ffi-bindings", "os::linux-apis"]
rust-version = "1.85"

# `include` is an allowlist: only these files are packaged for crates.io, so
# build artifacts and the sibling crates are left out automatically.
include = [
    "src/**/*.rs", "/build.rs", "/wrapper_ops.h", "/wrapper_trace.h",
    "emu-shim/et_emu_shim.cpp", "emu-shim/et_emu_shim.h", "emu-shim/CMakeLists.txt",
    "examples/*.rs", "/README.md", "/LICENSE",
]

# The public crate name is `et_soc1`, matching the C/C++ nomenclature, while the
# package on disk remains `et-rs`.
[lib]
name = "et_soc1"
path = "src/lib.rs"

[features]
# Build the FFI software-emulator backend (`FfiTransport`). Requires the SDK C++
# device-layer and a CMake toolchain; the default build stays pure-Rust ioctl.
emu = []

# Regenerate the vendored FFI bindings from the SDK headers and rewrite the
# committed `src/bindings_*.rs`. Maintainers only: needs the SDK at `/opt/et`
# (or `ET_SDK_PREFIX`) and `libclang`. The default build uses the committed
# bindings and needs neither the SDK nor bindgen.
regenerate-bindings = ["dep:bindgen"]

[dependencies]
libc = "0.2"

[dev-dependencies]
# Shared host/device ABI, used by the example launchers to build kernel args
# from the same structs the kernels read. A dev-dependency: not part of the
# published library surface. Versioned so the published examples resolve against
# the crates.io release; the path is used for in-repo development.
et-abi = { path = "../et-abi", version = "0.1" }

[build-dependencies]
# Only pulled in (and compiled) under the `regenerate-bindings` feature.
bindgen = { version = "0.72", optional = true }

[package.metadata.docs.rs]
# docs.rs builds default features only, so it never touches the SDK.
no-default-features = true

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "hello_sysemu"
path = "examples/hello_sysemu.rs"
required-features = ["emu"]

# SPSC concurrency demo. Backend chosen by cfg: ioctl by default, emulator under
# `--features emu`.
[[example]]
name = "spsc"
path = "examples/spsc.rs"

# Data-parallel reduction demo. Backend chosen by cfg as above.
[[example]]
name = "reduce"
path = "examples/reduce.rs"
