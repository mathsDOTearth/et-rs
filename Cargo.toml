# Virtual workspace root for the three crates that publish independently to
# crates.io:
#   * et-abi  -- shared host/device ABI (no_std, no deps)
#   * et-rs   -- the host driver (lib `et_soc1`)
#   * et-k-rs -- device-side kernel-authoring library (lib `et_kernel`)
#
# et-rs and et-abi are host crates and form this workspace; `default-members`
# makes bare cargo commands (build/test/run --example) operate on et-rs. et-k-rs
# cross-compiles to riscv64imac with its own target config, so it is excluded and
# built/published from its own directory. Both et-rs and et-k-rs depend on et-abi.
[workspace]
resolver = "2"
members = ["et-abi", "et-rs"]
exclude = ["et-k-rs"]
default-members = ["et-rs"]
